services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]

  backend:
    build: { context: ./docker/php }
    volumes: ["./backend:/var/www/html"]
    env_file: ./backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  queue:
    build: { context: ./docker/php }
    command: php artisan queue:work redis --tries=3 --backoff=30 --max-time=3600
    volumes: ["./backend:/var/www/html"]
    env_file: ./backend/.env
    depends_on: [backend]
    restart: unless-stopped

  scheduler:
    build: { context: ./docker/php }
    command: php artisan schedule:work
    volumes: ["./backend:/var/www/html"]
    env_file: ./backend/.env
    depends_on: [backend]
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mangaroling}
      POSTGRES_USER: ${DB_USERNAME:-mangaroling}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mangaroling}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes: ["redisdata:/data"]

volumes:
  pgdata:
  redisdata:
